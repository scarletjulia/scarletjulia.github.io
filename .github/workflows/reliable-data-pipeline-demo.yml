name: Reliable data pipeline demo

on:
  push:
    paths:
      - "labs/reliable-data-pipeline-demo/**"
      - ".github/workflows/reliable-data-pipeline-demo.yml"
  pull_request:
    paths:
      - "labs/reliable-data-pipeline-demo/**"
      - ".github/workflows/reliable-data-pipeline-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/reliable-data-pipeline-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v
