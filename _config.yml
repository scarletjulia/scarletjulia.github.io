  Portfólio de Analytics Engineering com projetos sobre modelagem analítica,
  transformação, qualidade de dados e métricas confiáveis para tomada de decisão.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://scarletjulia.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# SEO PLUGIN
social:
  name: Scarlet Júlia
  links:
    #- https://twitter.com/BenBalter
    #- https://www.facebook.com/ben.balter
    - https://www.linkedin.com/in/scarlet-júlia-ledo-amaral/
    #- https://plus.google.com/+BenBalter
