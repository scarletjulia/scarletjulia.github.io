# THEME SETTINGS
navigation: # Navigation links
  - {name: 'Início', link: '/'}
  - {name: 'Projetos', link: '/#projetos'}
  - {name: 'Sobre', link: '/sobre'}
  - {name: 'Contato', link: '/contato'}

tagline: >
  Transformo dados brutos em modelos analíticos, métricas confiáveis e informação pronta para decisão.

hero_img: posts/trajetoria_lg.jpg # Main background image: use the path from /assets/img/ => This will output /assets/img/posts/sleek_lg.jpg

hero_img1: posts/sleek_lg.jpg

email: scarletjuliamk@gmail.com # email for form submission

 # replace with your_twitter_username or comment to remove link from footer
github_username:  scarletjulia # replace with your_github_username or comment to remove link from footer
instagram_username: scarletjuliamk/ # replace with your_instagram_username or comment to remove link from footer

disqus:
  shortname: scarlet # to enable comments replace with your_disqus_shortname

google_tag_manager: GTM-5Z9JZD7 # Uncomment to enable GTM. Replace GTM-XXXXXXX with your GTM container ID

service_worker: false

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge # or pygments or null
# theme: jekyll-sleek # Uncomment if you're using the theme as a ruby gem
exclude:
  - README.md
  - node_modules
  - script
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - npm-debug.log
  - gulpfile.js
  - sleek.jpg

include: ['_pages']
permalink: /:title/

compress_html:
  clippings: all

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

theme: jekyll-theme-slate

