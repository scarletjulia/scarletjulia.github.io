# SITE CONFIGURATION
encoding: UTF-8
lang: pt-BR
title: Scarlet Júlia # your site title
author: Scarlet Júlia
logo: /assets/img/icons/jl.png
description: > # Meta description of Homepage
  Biblioteca técnica de Scarlet Júlia sobre pipelines confiáveis, PySpark, SQL,
  qualidade de dados, observabilidade e Analytics Engineering.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://scarletjulia.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# SEO PLUGIN
social:
  name: Scarlet Júlia
  links:
    #- https://twitter.com/BenBalter
    #- https://www.facebook.com/ben.balter
    - https://www.linkedin.com/in/scarletjulia/
    #- https://plus.google.com/+BenBalter
    - https://github.com/scarletjulia
    #- https://keybase.io/benbalter

# THEME SETTINGS
navigation: # Navigation links
  - {name: 'Início', link: '/'}
  - {name: 'Artigos', link: '/#artigos'}
  - {name: 'Biblioteca', link: '/biblioteca'}
  - {name: 'Sobre', link: '/sobre'}
  - {name: 'Contato', link: '/contato'}

tagline: >
  Arquitetura, pipelines escaláveis, PySpark, SQL, qualidade, observabilidade e Analytics Engineering.

hero_img: posts/trajetoria_lg.jpg # Main background image: use the path from /assets/img/ => This will output /assets/img/posts/sleek_lg.jpg

hero_img1: posts/sleek_lg.jpg

email: scarletjuliamk@gmail.com # email for form submission

 # replace with your_twitter_username or comment to remove link from footer
github_username:  scarletjulia # replace with your_github_username or comment to remove link from footer
instagram_username: scarletjuliamk/ # replace with your_instagram_username or comment to remove link from footer

disqus:
  shortname: scarlet # to enable comments replace with your_disqus_shortname

google_tag_manager: GTM-5Z9JZD7 # Uncomment to enable GTM. Replace GTM-XXXXXXX with your GTM container ID

service_worker: false

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge # or pygments or null
# theme: jekyll-sleek # Uncomment if you're using the theme as a ruby gem
exclude:
  - README.md
  - node_modules
  - script
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - npm-debug.log
  - gulpfile.js
  - sleek.jpg
  - labs

include: ['_pages']
permalink: /:title/

compress_html:
  clippings: all

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

theme: jekyll-theme-slate

